name: Publish Cargo

on:
  workflow_call:
    inputs:
      frontend-artifact:
        description: "Name of the frontend built artifact"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: CARGO
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@just
      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend-artifact }}
          path: dist
      # build.rs no longer fails when the frontend is missing — it warns and
      # writes a placeholder. That is right for a developer build and wrong for
      # a release, so this is the gate that stops a placeholder UI being
      # published. Without it nothing would.
      - name: Verify the frontend is real, not a placeholder
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          if grep -q "Dashboard frontend not built" dist/index.html; then
            echo "::error::dist/ holds the build.rs placeholder page, not the built frontend."
            exit 1
          fi
          ls dist/*.wasm >/dev/null 2>&1 || { echo "::error::no .wasm in dist/ — the frontend was not built"; exit 1; }
          echo "Frontend bundle present: $(ls dist/*.wasm)"
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty
