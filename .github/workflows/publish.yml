name: Publish

on:
  push:
    branches: ["main"]

# A release commit touches Cargo.toml and Cargo.lock, so ci.yml fires on the same
# push. That run is independent of this one and cannot gate it — so this workflow
# runs the same reusable test workflows itself and makes both publish jobs depend
# on them. Before that, `cargo publish` and `uv publish` ran in parallel with the
# test suite and a red build published anyway, with no job failing to say so.
jobs:
  check-release:
    uses: ./.github/workflows/check-release.yml

  build-assets:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/build-assets.yml

  # ─── Gate ────────────────────────────────────────────────────────────────
  # Nothing below publishes unless both of these pass.

  rust:
    needs: [check-release, build-assets]
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/rust.yml

  python:
    needs: [check-release, build-assets]
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/python.yml

  # ─── Publish ─────────────────────────────────────────────────────────────

  publish-cargo:
    needs: [check-release, build-assets, rust, python]
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/publish-cargo.yml
    with:
      frontend-artifact: ${{ needs.build-assets.outputs.frontend-artifact }}
    secrets: inherit

  publish-pypi:
    needs: [check-release, build-assets, rust, python]
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/publish-pypi.yml
    with:
      frontend-artifact: ${{ needs.build-assets.outputs.frontend-artifact }}
      cli-artifact-prefix: ${{ needs.build-assets.outputs.cli-artifact-prefix }}
    secrets: inherit

  github-release:
    needs: [check-release, publish-pypi]
    if: needs.check-release.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ needs.check-release.outputs.version }}
      artifact-pattern: "wheels-*"
    secrets: inherit
