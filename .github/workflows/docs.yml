name: Docs

on:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: taiki-e/install-action@just

      # Zola is pinned, never `@latest`. The `@zola` shorthand installs the newest
      # release, so 0.23 — which replaced the template engine the reticle theme is
      # written against — reached this job the day it shipped and broke the docs
      # deploy on three consecutive releases without failing anything else.
      # `zola_version` in the Justfile is the only place the version is written;
      # `just check-zola` holds the dev shell to the same one.
      - name: Resolve the pinned Zola version
        id: zola
        run: echo "version=$(just --evaluate zola_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ steps.zola.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler

      - name: Build Zola documentation
        run: zola --root docs build

      - name: Build Rust API docs
        run: |
          just build-docs
          mkdir -p docs/public/api
          cp -r target/doc/* docs/public/api/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          force_orphan: true
