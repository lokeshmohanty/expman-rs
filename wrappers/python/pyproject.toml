[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "expman-rs"
# Single-sourced from ../../Cargo.toml by maturin. Do not hard-code a version
# here: `expman.__version__` comes from CARGO_PKG_VERSION, so a literal that
# drifted would ship a wheel whose metadata disagreed with the module itself.
dynamic = ["version"]
description = "High-performance experiment manager with Rust backend"
authors = [{ name = "Lokesh Mohanty", email = "lokesh1197@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest", "numpy", "matplotlib", "scipy", "imageio[ffmpeg]", "pre-commit", "ruff", "maturin"]

[project.scripts]
exp = "expman.cli:main"

[tool.maturin]
manifest-path = "../../Cargo.toml"
python-source = "."
module-name = "expman.expman"
features = ["python"]
include = ["expman/bin/exp*", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["expman"]
